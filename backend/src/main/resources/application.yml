server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magyen_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdotenv:
  directory: ..

magyen:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    bootstrap:
      enabled: "${AUTH_BOOTSTRAP_ENABLED:false}"
      username: "${AUTH_BOOTSTRAP_USERNAME:}"
      password: "${AUTH_BOOTSTRAP_PASSWORD:}"
      role: "${AUTH_BOOTSTRAP_ROLE:ADMIN}"
  object-storage:
    endpoint: ${MAGYEN_OBJECT_STORAGE_ENDPOINT:}
    region: ${MAGYEN_OBJECT_STORAGE_REGION:us-east-1}
    access-key: ${MAGYEN_OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${MAGYEN_OBJECT_STORAGE_SECRET_KEY:}
    bucket: ${MAGYEN_OBJECT_STORAGE_BUCKET:}
    key-prefix: ${MAGYEN_OBJECT_STORAGE_KEY_PREFIX:local}