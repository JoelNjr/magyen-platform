server:
  address: 0.0.0.0
  port: ${PORT:10000}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/magyen_platform}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdotenv:
  directory: ..

magyen:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    bootstrap:
      enabled: "${AUTH_BOOTSTRAP_ENABLED:false}"
      username: "${AUTH_BOOTSTRAP_USERNAME:}"
      password: "${AUTH_BOOTSTRAP_PASSWORD:}"
      role: "${AUTH_BOOTSTRAP_ROLE:ADMIN}"