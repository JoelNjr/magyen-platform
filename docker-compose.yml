services:
  postgres:
    image: postgres:17
    container_name: magyen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: magyen_platform
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
